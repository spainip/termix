              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 10
            },
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "64Mi"
              }
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "/bin/sh",
                  "-c",
                  "wget -q -O /dev/null http://localhost:30001/health || exit 1"
                ]
              },
              "failureThreshold": 180,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 10
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/app/data",
                "name": "v-fd8debbcf34f77eb"
              },
              {
                "mountPath": "/dev/shm",
                "name": "shm"
              }
            ],
            "workingDir": "/app"
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "imagePullSecrets": [
          {
            "name": "registry-credentials"
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "spainip-k3s"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 120,
        "volumes": [
          {
            "name": "v-fd8debbcf34f77eb",
            "persistentVolumeClaim": {
              "claimName": "v-fd8debbcf34f77eb"
            }
          },
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "67108864"
            },
            "name": "shm"
          }
        ]
      }
    }
  }
}
